name: Build ZG-204ZL PIR (development)
on:
  push:
    branches:
      - dev/pir-occupancy-diagnostics
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout firmware sources
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y make unzip bzip2 python3
      - name: Install bundled Telink SDK and TC32 toolchain
        run: make install
      - name: Build ZG-204ZL test firmware
        run: |
          make -j2 PROJECT_NAME=ZG204ZL VERSION_BIN=_pir_diag POJECT_DEF="-DBOARD=BOARD_ZG204ZL" ZNAME="ZG-204ZL PIR diagnostic"
      - name: Collect firmware checksums
        run: |
          sha256sum bin/ZG204ZL_pir_diag.bin bin/ZG204ZL.zigbee > bin/ZG204ZL_pir_diag.sha256
      - name: Upload test firmware artifacts (NOT automatically flashed)
        uses: actions/upload-artifact@v4
        with:
          name: zg204zl-pir-diagnostic
          path: |
            bin/ZG204ZL_pir_diag.bin
            bin/ZG204ZL.zigbee
            bin/ZG204ZL_pir_diag.sha256
